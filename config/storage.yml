test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# DigitalOcean Spaces — S3-compatible, nên dùng service S3 với endpoint riêng.
# Cùng khối này chạy được với mọi nhà cung cấp S3-compatible khác (VNG vStorage,
# Viettel, CMC…) chỉ bằng cách đổi SPACES_ENDPOINT và SPACES_REGION.
#
# `public: false` là cố ý và không được đổi: bucket chứa ảnh khuôn mặt trẻ em,
# PDF cam kết và chữ ký tay. Ứng dụng phát URL đã ký qua chế độ proxy
# (`rails_storage_proxy_path`), nên không có tệp nào đọc được bằng link trần.
spaces:
  service: PrefixedS3
  prefix: <%= ENV.fetch("SPACES_PREFIX", "boidat") %>
  access_key_id:     <%= ENV["SPACES_KEY"] %>
  secret_access_key: <%= ENV["SPACES_SECRET"] %>
  region:            <%= ENV.fetch("SPACES_REGION", "sgp1") %>
  bucket:            <%= ENV["SPACES_BUCKET"] %>
  endpoint:          <%= ENV.fetch("SPACES_ENDPOINT") { "https://#{ENV.fetch('SPACES_REGION', 'sgp1')}.digitaloceanspaces.com" } %>
  public: false
  upload:
    cache_control: "private, max-age=0, no-store"

# Spaces là kho chính, đĩa máy chủ là bản sao.
#
# Không thừa: bản sao lưu hằng đêm đóng gói thư mục shared/storage, và đó là
# bản sao lưu duy nhất đã được kiểm chứng khôi phục thật. Nếu tệp mới chỉ nằm
# trên Spaces thì từ nay bản sao lưu ấy không còn phủ ảnh khuôn mặt và cam kết
# nữa — mất phủ một cách âm thầm, đúng kiểu hỏng không ai biết cho tới lúc cần.
# DO Spaces không có versioning, nên xoá nhầm là mất hẳn.
#
# Giá phải trả là lưu hai nơi. Với vài MB ảnh trên ổ còn 28 GB thì rẻ hơn nhiều
# so với việc mất dữ liệu sinh trắc của trẻ em. Đặt SPACES_MIRROR_LOCAL=false
# để tắt nếu sau này dung lượng thành vấn đề.
spaces_mirrored:
  service: Mirror
  primary: spaces
  mirrors: [ local ]
