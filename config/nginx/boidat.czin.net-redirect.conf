# Tên miền cũ — 301 vĩnh viễn sang boidat.tiumpower.com (giữ cert cũ để redirect
# trên HTTPS hợp lệ; DNS boidat.czin.net + *.boidat.czin.net phải vẫn trỏ về máy này).
server {
  listen 80;
  server_name boidat.czin.net;
  return 301 https://boidat.tiumpower.com$request_uri;
}
server {
  listen 80;
  server_name ~^(?<sub>[^.]+)\.boidat\.czin\.net$;
  return 301 https://$sub.boidat.tiumpower.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name boidat.czin.net;
  ssl_certificate     /etc/letsencrypt/live/boidat-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/boidat-wildcard/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://boidat.tiumpower.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name ~^(?<sub>[^.]+)\.boidat\.czin\.net$;
  ssl_certificate     /etc/letsencrypt/live/boidat-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/boidat-wildcard/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://$sub.boidat.tiumpower.com$request_uri;
}
